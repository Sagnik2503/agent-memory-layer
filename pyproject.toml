[project]
name = "memory-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.20.0",
    "groq>=1.7.0",
    "instructor[google-genai]>=1.7.0",
    "langgraph>=0.2.0",
    "openai>=1.52.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.31.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "expensive: marks tests that require LLM API credits (deselect with '-m \"not expensive\"')",
]
