<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Expense Tracker</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="dashboard">
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/">Expense Tracker</a>
      <nav class="site-nav" aria-label="Primary">
        <a data-nav="dashboard" href="/">Dashboard</a>
        <a data-nav="expenses" href="/expenses">Expenses</a>
        <a data-nav="budgets" href="/budgets">Budgets</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1>Dashboard</h1>
    <div class="month-nav">
      <button type="button" class="month-nav-btn" data-month-step="-1" aria-label="Previous month">&#8249;</button>
      <p class="month-label" id="month-label">&nbsp;</p>
      <button type="button" class="month-nav-btn" data-month-step="1" aria-label="Next month">&#8250;</button>
    </div>
    <section class="card">
      <h2 class="card-title">Spending this month</h2>
      <div class="totals" id="dashboard-totals" aria-live="polite">
        <p class="muted">Loading this month&rsquo;s totals&hellip;</p>
      </div>
    </section>
    <section class="card">
      <h2 class="card-title">Budget status</h2>
      <div class="budget-list" id="dashboard-budgets" aria-live="polite">
        <p class="muted">Loading budget status&hellip;</p>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
