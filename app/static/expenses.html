<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses — Expense Tracker</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="expenses">
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/">Expense Tracker</a>
      <nav class="site-nav" aria-label="Primary">
        <a data-nav="dashboard" href="/">Dashboard</a>
        <a data-nav="expenses" href="/expenses">Expenses</a>
        <a data-nav="budgets" href="/budgets">Budgets</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1>Expenses</h1>
    <div class="month-nav">
      <button type="button" class="month-nav-btn" data-month-step="-1" aria-label="Previous month">&#8249;</button>
      <p class="month-label" id="month-label">&nbsp;</p>
      <button type="button" class="month-nav-btn" data-month-step="1" aria-label="Next month">&#8250;</button>
    </div>
    <div class="filters">
      <label class="filter" for="filter-category">
        <span class="filter-label">Category</span>
        <select class="filter-control" id="filter-category">
          <option value="">All categories</option>
          <option value="food">food</option>
          <option value="transport">transport</option>
          <option value="shopping">shopping</option>
          <option value="bills">bills</option>
          <option value="entertainment">entertainment</option>
          <option value="health">health</option>
          <option value="personal_care">personal care</option>
          <option value="other">other</option>
        </select>
      </label>
      <label class="filter" for="filter-merchant">
        <span class="filter-label">Merchant</span>
        <input
          class="filter-control"
          id="filter-merchant"
          type="search"
          placeholder="Search merchants"
          autocomplete="off"
        >
      </label>
    </div>
    <div class="totals" id="totals" aria-live="polite"></div>
    <div class="expense-list" id="expense-list">
      <p class="muted" id="status">Loading expenses…</p>
    </div>
  </main>
  <button type="button" class="chat-fab" id="chat-toggle" aria-expanded="false" aria-controls="chat-panel">Chat</button>
  <aside class="chat-panel" id="chat-panel" aria-label="Chat" hidden>
    <div class="chat-head">
      <h2 class="chat-title">Chat</h2>
      <button type="button" class="chat-close" id="chat-close" aria-label="Close chat panel">&#215;</button>
    </div>
    <div class="chat-log" id="chat-log" aria-live="polite">
      <p class="muted chat-empty">Record spending or ask a question &mdash; e.g. &ldquo;I spent &#8377;500 on lunch&rdquo;.</p>
    </div>
    <form class="chat-composer" id="chat-composer">
      <input type="text" class="chat-input" id="chat-input" placeholder="I spent &#8377;500 on lunch&hellip;" autocomplete="off" aria-label="Message">
      <button type="submit" class="chat-send" id="chat-send">Send</button>
    </form>
  </aside>
  <script src="/static/app.js"></script>
</body>
</html>
