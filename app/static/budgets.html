<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgets — Expense Tracker</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="budgets">
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/">Expense Tracker</a>
      <nav class="site-nav" aria-label="Primary">
        <a data-nav="dashboard" href="/">Dashboard</a>
        <a data-nav="expenses" href="/expenses">Expenses</a>
        <a data-nav="budgets" href="/budgets">Budgets</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1>Budgets</h1>
    <div class="month-nav">
      <button type="button" class="month-nav-btn" data-month-step="-1" aria-label="Previous month">&#8249;</button>
      <p class="month-label" id="month-label">&nbsp;</p>
      <button type="button" class="month-nav-btn" data-month-step="1" aria-label="Next month">&#8250;</button>
    </div>
    <section class="placeholder">
      <p class="placeholder-lead">Coming soon — budget status for each category and overall, plus your active subscriptions.</p>
      <p class="muted">Until then, the <a href="/expenses">Expenses page</a> lists everything recorded this month.</p>
    </section>
  </main>
  <button type="button" class="chat-fab" id="chat-toggle" aria-expanded="false" aria-controls="chat-panel">Chat</button>
  <aside class="chat-panel" id="chat-panel" aria-label="Chat" hidden>
    <div class="chat-head">
      <h2 class="chat-title">Chat</h2>
      <button type="button" class="chat-close" id="chat-close" aria-label="Close chat panel">&#215;</button>
    </div>
    <div class="chat-log" id="chat-log" aria-live="polite">
      <p class="muted chat-empty">Record spending or ask a question &mdash; e.g. &ldquo;I spent &#8377;500 on lunch&rdquo;.</p>
    </div>
    <form class="chat-composer" id="chat-composer">
      <input type="text" class="chat-input" id="chat-input" placeholder="I spent &#8377;500 on lunch&hellip;" autocomplete="off" aria-label="Message">
      <button type="submit" class="chat-send" id="chat-send">Send</button>
    </form>
  </aside>
  <script src="/static/app.js"></script>
</body>
</html>
